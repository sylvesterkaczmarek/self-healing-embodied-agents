[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-embodied-agents"
version = "0.1.0"
description = "Reproducible experiments on autonomous failure detection and recovery in embodied manipulation agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=2.0",
  "torch>=2.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
