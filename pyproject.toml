[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-embodied-agents"
version = "0.2.0"
description = "Reproducible experiments on autonomous failure detection and recovery in embodied manipulation agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["self_healing_embodied_agents*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["F"]
