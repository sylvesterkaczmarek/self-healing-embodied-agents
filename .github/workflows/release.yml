name: Release
on:
  push:
    branches: ["release/v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify exact release commit
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish verified GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-candidate
          path: verified
      - name: Bind verified artifacts to reviewed main commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python -c 'import re,sys; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",sys.argv[1])' "$VERSION"
          test "$GITHUB_REF_NAME" = "release/v$VERSION"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release tag.' >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib,json,tomllib
          from pathlib import Path
          meta=tomllib.loads(Path('pyproject.toml').read_text())['project']
          proof=json.loads(Path('verified/proof/distribution.json').read_text())
          assert proof['status']=='PASS' and proof['version']==meta['version'] and proof['distribution']==meta['name']
          for suffix,key in (('*.whl','wheel_sha256'),('*.tar.gz','sdist_sha256')):
              paths=list(Path('verified/dist').glob(suffix));assert len(paths)==1
              assert hashlib.sha256(paths[0].read_bytes()).hexdigest()==proof[key]
          PY
          mkdir release-assets
          cp verified/dist/* release-assets/
          cp verified/proof/distribution.json release-assets/
          cp "docs/release-$VERSION.md" release-assets/RELEASE_NOTES.md
          cp docs/independent-review-2026-11-05.md release-assets/INDEPENDENT_REVIEW.md
          git archive --format=zip --output=release-assets/source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > release-assets/COMMIT.txt
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish without replacing previous files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Self-Healing Embodied Agents $TAG" \
            --notes-file release-assets/RELEASE_NOTES.md --latest=false
  public-verification:
    name: Verify public release installation
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Download and hash public assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public-release
          (cd public-release && sha256sum --check --strict SHA256SUMS.txt)
          test "$(cat public-release/COMMIT.txt)" = "$GITHUB_SHA"
      - name: Test fresh non-editable public installation
        run: python scripts/verify_distribution.py public-release/*.whl public-release/*.tar.gz --report public-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-verification
          path: public-verification.json
          if-no-files-found: error
          retention-days: 90
