name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip check
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - name: Audit complete historical pilot
        if: matrix.python == '3.13'
        run: |
          python -m scripts.verify_comparison results/comparison-v1/evaluation --replay-actions
          python -m scripts.verify_comparison results/comparison-v1/development --replay-actions
          python -m scripts.showcase --model artifacts/world_model.pt --out '${{ runner.temp }}/showcase'
      - name: Exercise fresh training and all fault conditions
        if: matrix.python == '3.13'
        run: |
          python scripts/train_world_model.py --episodes 40 --epochs 12 --out '${{ runner.temp }}/smoke'
          python scripts/run_benchmark.py --model '${{ runner.temp }}/smoke/artifacts/world_model.pt' --seeds 1 --episodes-per-condition 1 --action-budget 5 --out '${{ runner.temp }}/smoke/results'
          git diff --exit-code
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-reference.txt
  package:
    name: Verify installed candidate
    needs: [test, macos, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_distribution.py dist/*.whl dist/*.tar.gz --report proof/distribution.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate
          path: |
            dist/*
            proof/*
          if-no-files-found: error
          retention-days: 30
